# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# # Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_checkout:
      # a switch: while the file .rtd-skip exists (make rtd-off / rtd-on) every build is cancelled and the published site stays as it is;
      # exit code 183 cancels the build
      - |
        if [ -f .rtd-skip ]; then
          exit 183
        fi

# Sphinx with the dirhtml builder: every page keeps the address it had under mkdocs (tutorial/theory/, dev/cables/, ...)
sphinx:
  builder: dirhtml
  configuration: docs/conf.py
  fail_on_warning: true

# Optionally declare the Python requirements required to build your docs
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

