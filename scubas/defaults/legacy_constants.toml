# The constants of the existing modules (SCUBAS 0.1.9), with their provenance. READ-ONLY: the code does not read this file, it is a record of what the code uses, and
# tests/test_provenance.py fails if a value here differs from the value in the code. A status of "sourced" means a document is named in the source; "assumed" means a
# legacy default or a hard-coded number whose origin is not documented in the code (say so, do not invent a citation). Pattern and rules: docs/dev/parameters.md, ADR 0010.

[conductivity]
seawater_resistivity_ohm_m = { value = 0.3, unit = "ohm m", status = "sourced", source = "default of ConductivityProfile; the layer table of docs/tutorial/netmodel.md, from the LITHO1.0-based study of Chakraborty et al. (2022), Front. Phys. 10:1022475" }
sediment_resistivity_ohm_m = { value = 3.0, unit = "ohm m", status = "sourced", source = "default of ConductivityProfile; the layer table of docs/tutorial/netmodel.md (Chakraborty et al. 2022)" }
crust_resistivity_ohm_m = { value = 3000.0, unit = "ohm m", status = "sourced", source = "default of ConductivityProfile; the layer table of docs/tutorial/netmodel.md (Chakraborty et al. 2022)" }
lithosphere_resistivity_ohm_m = { value = 1000.0, unit = "ohm m", status = "sourced", source = "default of ConductivityProfile; the layer table of docs/tutorial/netmodel.md (Chakraborty et al. 2022)" }
asthenosphere_resistivity_ohm_m = { value = 100.0, unit = "ohm m", status = "sourced", source = "default of ConductivityProfile (the 'Upper Mantle' layer); the layer table of docs/tutorial/netmodel.md (Chakraborty et al. 2022)" }
transition_zone_resistivity_ohm_m = { value = 10.0, unit = "ohm m", status = "sourced", source = "default of ConductivityProfile; the layer table of docs/tutorial/netmodel.md (Chakraborty et al. 2022)" }
lower_mantle_resistivity_ohm_m = { value = 1.0, unit = "ohm m", status = "sourced", source = "default of ConductivityProfile; the layer table of docs/tutorial/netmodel.md (Chakraborty et al. 2022)" }
transition_zone_top_km = { value = 410.0, unit = "km", status = "sourced", source = "default of ConductivityProfile: the depth at which the transition zone starts; Chakraborty et al. (2022), Front. Phys. 10:1022475, Section 2.1.1: the mantle transition zone sits at 410-660 km" }
transition_zone_bottom_km = { value = 660.0, unit = "km", status = "sourced", source = "default of ConductivityProfile: the depth at which the transition zone ends; Chakraborty et al. (2022), Front. Phys. 10:1022475, Section 2.1.1: the mantle transition zone sits at 410-660 km" }
profile_max_depth_km = { value = 1000.0, unit = "km", status = "sourced", source = "default of ConductivityProfile: the profile ends at this depth, so the lower mantle is 1000 - 660 km thick; Chakraborty et al. (2022), Front. Phys. 10:1022475, Section 2.1.1: a fixed model bottom at 1,000 km" }
grid_interpolation_method = { value = "nearest", unit = "", status = "assumed", source = "default of ConductivityProfile: how the LITHO1.0 grid is interpolated ('nearest' or 'linear')" }
earth_model_file = { value = "LITHO1.0.nc", unit = "", status = "sourced", source = "default of ConductivityProfile: the file name of the LITHO1.0 netCDF product distributed by the IRIS Earth Model Collaboration; cached in .scubas_config/ of the working directory" }
earth_model_uri = { value = "http://ds.iris.edu/files/products/emc/emc-files/LITHO1.0.nc", unit = "", status = "sourced", source = "default of ConductivityProfile: the IRIS Earth Model Collaboration copy of LITHO1.0; plain HTTP and no integrity check (see SECURITY.md)" }

[preprocess]
taper_fraction = { value = 0.1, unit = "", status = "assumed", source = "default p of Preprocess: the fraction of the record that the cosine taper covers before the transform to the frequency domain" }
baseline_samples = { value = 120, unit = "samples", status = "assumed", source = "hard-coded in Preprocess.detrend_magnetic_field: the median of the first 120 samples is removed as the baseline" }

[models]
flim_min_Hz = { value = 1e-6, unit = "Hz", status = "assumed", source = "default of OceanModel: the lowest frequency of the transfer-function grid, which is also its spacing (round(fmax/fmin) + 1 points)" }
flim_max_Hz = { value = 1.0, unit = "Hz", status = "assumed", source = "default of OceanModel: the highest frequency of the transfer-function grid" }

[cables]
width_m = { value = 1.0, unit = "m", status = "assumed", source = "default width of TransmissionLine (the docstring says metres): the cable's cross-section that scales the shunt admittance" }
flim_min_Hz = { value = 1e-6, unit = "Hz", status = "assumed", source = "default of TransmissionLine elec_params, passed to OceanModel" }
flim_max_Hz = { value = 1.0, unit = "Hz", status = "assumed", source = "default of TransmissionLine elec_params, passed to OceanModel" }

[geometry]
north_east_split_divisor = { value = 1.4142135623730951, unit = "", status = "assumed", source = "CableSection: a total length given without a direction is split equally, length_north = length_east = length / sqrt(2)" }
lat_km_per_degree_a = { value = 111.133, unit = "km/degree", status = "sourced", source = "CableSection.compute_lengths: length of a degree of latitude is (a - b cos 2 lambda) with lambda the mean latitude; Chakraborty et al. (2022), Front. Phys. 10:1022475, Equation 4 (WGS84 geodetic model, as used for power-system modelling)" }
lat_km_per_degree_b = { value = 0.56, unit = "km/degree", status = "sourced", source = "CableSection.compute_lengths: see lat_km_per_degree_a (Chakraborty et al. (2022), Equation 4)" }
lon_km_per_degree_a = { value = 111.5065, unit = "km/degree", status = "sourced", source = "CableSection.compute_lengths: length of a degree of longitude is (a - b cos 2 lambda) cos lambda; Chakraborty et al. (2022), Front. Phys. 10:1022475, Equation 5 (WGS84 geodetic model)" }
lon_km_per_degree_b = { value = 0.1872, unit = "km/degree", status = "sourced", source = "CableSection.compute_lengths: see lon_km_per_degree_a (Chakraborty et al. (2022), Equation 5)" }

[utils]
earth_radius_km = { value = 6371.0, unit = "km", status = "assumed", source = "default Re of GreatCircle: the mean radius of a spherical Earth, rounded" }

[sources]
current_height_km = { value = 110.0, unit = "km", status = "assumed", source = "default h of Current: the height of the ionospheric line current (given in km by default)" }
cauchy_width = { value = 0.0, unit = "km", status = "assumed", source = "default a of Current: the width of the Cauchy-distributed current (km by default)" }
current_amplitude = { value = 1.0, unit = "MA", status = "assumed", source = "default I of Current: the current (mega-amperes by default)" }

[readers]
iaga_missing_values = { value = [99999.9, 99999.0, 88888.8, 88888.0], unit = "", status = "sourced", source = "OceanModel.read_iaga: the IAGA-2002 data exchange format marks a missing value with 99999 and an element that is not recorded with 88888; these become gaps" }
gap_spline_order = { value = 2, unit = "", status = "assumed", source = "OceanModel.read_Bfield_data: gaps in a component are filled by Series.interpolate(method='spline', order=2)" }

[monte_carlo]
default_draws = { value = 100, unit = "", status = "assumed", source = "default n of ConductivityProfile.compile_mcmc_bined_profiles" }
default_random_seed = { value = 0, unit = "", status = "assumed", source = "default random_seed of ConductivityProfile.compile_mcmc_bined_profiles (numpy's global seed is set to it)" }
shelf_thickness_min_km = { value = 0.01, unit = "km", status = "assumed", source = "default lower bound of the seawater thickness drawn for the end bins in compile_mcmc_bined_profiles" }
shelf_thickness_max_km = { value = 1.0, unit = "km", status = "assumed", source = "default upper bound of the seawater thickness drawn for the end bins in compile_mcmc_bined_profiles" }
