[build-system]
requires = ["setuptools>=61.0,<77", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scubas"
version = "0.1.9"
description = "Precision ionospheric radio sounding tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Shibaji Chakraborty", email = "chakras4@erau.edu"}]
maintainers = [{name = "Shibaji Chakraborty", email = "chakras4@erau.edu"}]
keywords = [
  "Python>=3.6",
  "submarine cable",
  "electrical surge",
  "geomagnetic induction",
  "geomagnetic disturbance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Operating System :: OS Independent",
]
dependencies = [
  "pandas",
  "matplotlib>=3.3.4",
  "pyproj",
  "loguru",
  "scipy",
  "SciencePlots",
]
license = {text = "LGPL-3.0-or-later"}

[project.urls]
Homepage = "https://github.com/shibaji7/SCUBAS"
Documentation = "https://scubas.readthedocs.io/en/latest/"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "litho: needs a real LITHO1.0.nc (set SCUBAS_LITHO1_PATH and run with -m litho)",
]

[tool.coverage.run]
branch = true
source = ["scubas"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "pyproj>=3",
  "matplotlib>=3.5",
  "numpy",
  "pandas",
  "loguru",
  "requests",
  "tqdm",
  "toml",
  "SciencePlots",
  "scipy",
  "ruff",
  "pre-commit",
]

[tool.scubas.coverage-floors]
# line coverage per module, checked by scripts/check_coverage_floors.py after a coverage run; a floor may only go up.
# Set on 2026-11-20 from the measured values (compat suite included) minus two points.
default = 90
"scubas/cables.py" = 93
"scubas/conductivity.py" = 94
"scubas/datasets.py" = 93
"scubas/models.py" = 90
"scubas/plotlib.py" = 95
"scubas/sources/current_sources.py" = 92
"scubas/utils.py" = 93

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["scubas*"]
