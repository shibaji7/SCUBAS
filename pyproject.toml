[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scubas"
dynamic = ["version"]
description = "SCUBAS: Submarine Cables Upset by Auroral Streams. The voltage induced on submarine cables by geomagnetic disturbances, from a transmission-line model of layered Ocean/Earth conductivity."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Shibaji Chakraborty", email = "chakras4@erau.edu"}]
maintainers = [{name = "Shibaji Chakraborty", email = "chakras4@erau.edu"}]
keywords = [
  "submarine cable",
  "geomagnetic disturbance",
  "geomagnetic induction",
  "geomagnetically induced voltage",
  "space weather",
  "transmission line",
  "magnetotelluric",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib>=3.3.4",
  "pyproj",
  "loguru",
  "scipy",
  "SciencePlots",
]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "NOTICE.md"]

[project.urls]
Homepage = "https://github.com/shibaji7/SCUBAS"
Documentation = "https://scubas.readthedocs.io/en/latest/"
Source = "https://github.com/shibaji7/SCUBAS"
Issues = "https://github.com/shibaji7/SCUBAS/issues"
Changelog = "https://github.com/shibaji7/SCUBAS/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "litho: needs a real LITHO1.0.nc (set SCUBAS_LITHO1_PATH and run with -m litho)",
]

[tool.coverage.run]
branch = true
source = ["scubas"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[project.optional-dependencies]
# plots and data repeat runtime dependencies on purpose (the names BOLTS uses): `pip install scubas[plots]` keeps working if they are ever made optional (not before 1.0, see ADR 0003)
plots = ["matplotlib>=3.3.4", "SciencePlots"]
data = ["pandas"]
dev = ["pytest>=8", "pytest-cov>=4", "ruff", "pre-commit", "build", "twine"]
docs = ["sphinx>=9.0,<9.1", "sphinx-rtd-theme>=3.0", "sphinx-autodoc-typehints>=3.6,<3.7", "sphinx-copybutton>=0.5", "myst-parser>=5.0"]

[tool.scubas.coverage-floors]
# line coverage per module, checked by scripts/check_coverage_floors.py after a coverage run; a floor may only go up.
# Set on 2026-11-20 from the measured values (compat suite included) minus two points.
default = 90
"scubas/cables.py" = 93
"scubas/conductivity.py" = 94
"scubas/datasets.py" = 93
"scubas/models.py" = 90
"scubas/plotlib.py" = 95
"scubas/sources/current_sources.py" = 92
"scubas/utils.py" = 93

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "scubas._version.__version__"}

[tool.setuptools.packages.find]
include = ["scubas*"]

[tool.setuptools.package-data]
scubas = ["defaults/*.toml"]
