name: build

# Build the distributions and test what a user installs: the wheel goes into a clean environment and the compatibility suite runs against it
# (not against the checkout). Nothing is published here: publishing is a separate, switched workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Check what is inside the distributions
        run: python scripts/check_dist.py

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/*.whl pytest
          # the package under test must be the installed one
          cd /tmp && /tmp/clean/bin/python -c "import scubas, sys; print(scubas.__file__); assert 'site-packages' in scubas.__file__"

      - name: Run the compatibility suite against the installed wheel
        env:
          SCUBAS_TEST_INSTALLED: "1"
        # `pytest` (not `python -m pytest`) and an empty pythonpath keep the checkout's scubas/ off sys.path, so the wheel is what is tested
        run: /tmp/clean/bin/pytest -o pythonpath= -q tests/compat
