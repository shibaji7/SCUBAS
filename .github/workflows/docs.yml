name: docs

# Read the Docs publishes the site; this job makes sure it builds without warnings (mkdocs --strict) and keeps the HTML for a week.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkdocs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/docs-requirements.txt

      - name: Install the documentation tools
        run: python -m pip install -r ci/docs-requirements.txt

      - name: Build the docs (warnings are errors)
        run: python -m mkdocs build --strict --site-dir site

      - uses: actions/upload-artifact@v7
        with:
          name: html
          path: site/
          retention-days: 7
