name: docs

# Read the Docs publishes the site; this job makes sure it builds without warnings (Sphinx with warnings as errors) and keeps the HTML for a week.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sphinx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the documentation tools and the package (autodoc imports it)
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install .

      - name: Build the docs (warnings are errors)
        run: python -m sphinx -W --keep-going -b dirhtml docs docs/_build/dirhtml

      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/_build/dirhtml/
          retention-days: 7
