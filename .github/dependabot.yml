version: 2
updates:
  # The workflow actions (checkout, setup-python, codecov, ...): each bump is a pull request whose CI run shows whether it works.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The documentation tools (docs/requirements.txt, a short pinned list). Grouped, so one pull request per week; its docs CI run (a Sphinx build with
  # warnings as errors) shows whether the new versions work. pyproject.toml is not listed: its dependencies are unpinned, so there is nothing to bump.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs-tools:
        patterns: ["*"]
    ignore:
      # Read the Docs builds with Python 3.11 (.readthedocs.yaml) and the docs are pinned to Sphinx 9.0.x. Sphinx 9.1 needs Python >= 3.12 and 9.2 needs
      # >= 3.13, and every newer sphinx-autodoc-typehints (3.6.3 and later) needs Python >= 3.12 and sphinx >= 9.1, so none of them can be installed there
      # (pull requests #18 and #22 failed on exactly that). Patch updates of Sphinx 9.0 are still proposed. Remove these rules when .readthedocs.yaml
      # and the docs CI job move to a newer Python.
      - dependency-name: "sphinx"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "sphinx-autodoc-typehints"
